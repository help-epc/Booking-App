<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an EPC Assessment â€” The EPC Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #111827;
  --ink2: #1f2d3d;
  --ink3: #5a6a7e;
  --accent: #e07b10;
  --accent-dark: #b85e05;
  --accent-light: #fff4e6;
  --accent-mid: #fdd9a8;
  --surface: #f4f6f9;
  --white: #ffffff;
  --border: #e2e8f0;
  --error: #c0392b;
  --error-bg: #fdf0ee;
  --success: #12805c;
  --success-bg: #ecfdf5;
  --warning-bg: #fffbeb;
  --warning-border: #fde68a;
  --warning-text: #92400e;
  --blue-bg: #eff6ff;
  --blue-border: #bfdbfe;
  --blue-text: #1d4ed8;
  --shadow: 0 4px 24px rgba(17,24,39,0.10);
  --radius: 14px;
  --radius-sm: 8px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: #1a3d5c;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.logo-mark {
  width: 38px;
  height: 38px;
  background: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-mark svg { width: 22px; height: 22px; }

.logo-text {
  color: white;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.logo-text span { color: #f5a623; }

.header-contact {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
}

.header-contact a {
  color: #f5a623;
  text-decoration: none;
  font-weight: 500;
}

.hero {
  background: #153047;
  padding: 40px 32px 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 300px;
  background: radial-gradient(ellipse, rgba(224,123,16,0.25) 0%, transparent 70%);
  pointer-events: none;
}

.hero h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(26px, 5vw, 40px);
  color: white;
  line-height: 1.2;
  margin-bottom: 10px;
  position: relative;
}

.hero h1 em {
  color: #f5a623;
  font-style: italic;
}

.hero p {
  color: rgba(255,255,255,0.65);
  font-size: 15px;
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.6;
  position: relative;
}

.trust-badges {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
  position: relative;
}

.badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.75);
}

.progress-wrap {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.progress-steps {
  display: flex;
  max-width: 720px;
  margin: 0 auto;
}

.step-tab {
  flex: 1;
  padding: 16px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #aab8b2;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.step-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.step-tab.done { color: var(--ink3); }

.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #e8f0ed;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.step-tab.active .step-num,
.step-tab.done .step-num {
  background: var(--accent);
  color: white;
}

.step-label { display: none; }

@media (min-width: 520px) {
  .step-label { display: inline; }
}

main {
  flex: 1;
  padding: 32px 16px 60px;
}

.form-card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 720px;
  margin: 0 auto;
  overflow: hidden;
}

.form-step { display: none; }
.form-step.active { display: block; }

.step-header {
  padding: 28px 32px 20px;
  border-bottom: 1px solid var(--border);
}

.step-header h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--ink);
  margin-bottom: 4px;
}

.step-header p {
  color: var(--ink3);
  font-size: 14px;
  line-height: 1.5;
}

.step-body { padding: 28px 32px; }

.type-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 8px;
}

.type-card {
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
  position: relative;
}

.type-card:hover {
  border-color: var(--accent-mid);
  background: var(--accent-light);
}

.type-card.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}

.type-card.selected::after {
  content: 'âœ“';
  position: absolute;
  top: 10px;
  right: 12px;
  width: 20px;
  height: 20px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.type-icon {
  font-size: 32px;
  margin-bottom: 10px;
  display: block;
}

.type-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}

.type-desc {
  font-size: 12px;
  color: var(--ink3);
  line-height: 1.4;
}

.field { margin-bottom: 20px; }

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 7px;
  letter-spacing: 0.01em;
}

.field label .req {
  color: var(--accent);
  margin-left: 2px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(224,123,16,0.12);
}

.field input.error,
.field select.error {
  border-color: var(--error);
}

.field .hint {
  font-size: 12px;
  color: var(--ink3);
  margin-top: 5px;
}

.error-msg {
  font-size: 12px;
  color: var(--error);
  margin-top: 5px;
  display: none;
}

.error-msg.show { display: block; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.price-bands { margin-bottom: 20px; }

.price-band-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 10px;
  letter-spacing: 0.01em;
}

.bands-grid { display: grid; gap: 8px; }

.band-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}

.band-option:hover {
  border-color: var(--accent-mid);
  background: var(--accent-light);
}

.band-option.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}

.band-radio {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.band-option.selected .band-radio {
  border-color: var(--accent);
  background: var(--accent);
}

.band-option.selected .band-radio::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
}

.band-info { flex: 1; }

.band-range {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.band-duration {
  font-size: 12px;
  color: var(--ink3);
}

.band-price {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
}

.price-summary {
  background: var(--accent-light);
  border: 1.5px solid var(--accent-mid);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
}

.price-summary-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  gap: 16px;
}

.price-row:last-child {
  margin-bottom: 0;
  padding-top: 10px;
  border-top: 1px solid var(--accent-mid);
}

.price-row .label {
  font-size: 14px;
  color: var(--ink2);
}

.price-row .value {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}

.price-row.total .label {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}

.price-row.total .value {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}

.postcode-status {
  display: none;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-top: 8px;
  font-weight: 500;
}

.postcode-status.zone {
  display: flex;
  background: var(--success-bg);
  color: var(--success);
  gap: 6px;
  align-items: center;
}

.postcode-status.err {
  display: flex;
  background: var(--error-bg);
  color: var(--error);
  gap: 6px;
  align-items: center;
}

.date-info {
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--warning-text);
  margin-bottom: 18px;
  line-height: 1.5;
}

.date-info strong { font-weight: 600; }

.availability-status {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.5;
}

.availability-status.loading {
  min-height: auto;
  display: block;
  text-align: left;
  background: #eef2ff;
  color: #3730a3;
}

.availability-status.ok {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid #bbf7d0;
}

.availability-status.err {
  background: var(--error-bg);
  color: var(--error);
  border: 1px solid #f5c2c7;
}

.calendar-heading {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 22px 0 10px;
}

.calendar-subnote {
  font-size: 13px;
  color: var(--ink3);
  line-height: 1.45;
  margin: -2px 0 12px;
}

.no-dates-message {
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  color: var(--blue-text);
  font-size: 13px;
  line-height: 1.5;
}

.days-grid { display: grid; gap: 12px; }

.day-card {
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  background: white;
  transition: all 0.15s;
}

.day-card.good { border-color: #bbf7d0; }
.day-card.open { border-color: var(--blue-border); }
.day-card.poor {
  border-color: var(--warning-border);
  background: #fffdf7;
}
.day-card.full {
  opacity: 0.68;
  background: #f8fafc;
}

.day-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 12px;
}

.day-title {
  font-weight: 700;
  color: var(--ink);
  font-size: 15px;
}

.day-meta {
  font-size: 12px;
  color: var(--ink3);
  margin-top: 2px;
}

.day-capacity {
  font-size: 12px;
  color: var(--ink3);
  text-align: right;
}

.route-message {
  font-size: 13px;
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  line-height: 1.45;
  font-weight: 500;
}

.route-message strong {
  display: block;
  margin-bottom: 3px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.route-message.good {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid #bbf7d0;
}

.route-message.open {
  background: var(--blue-bg);
  color: var(--blue-text);
  border: 1px solid var(--blue-border);
}

.route-message.poor {
  background: var(--warning-bg);
  color: var(--warning-text);
  border: 1px solid var(--warning-border);
}

.route-message.unknown {
  background: #f8fafc;
  color: var(--ink3);
  border: 1px solid var(--border);
}

.window-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.window-option {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  cursor: pointer;
  transition: all 0.15s;
  background: white;
}

.window-option:hover:not(.disabled) {
  border-color: var(--accent-mid);
  background: var(--accent-light);
}

.window-option.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}

.window-option.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  background: #f1f5f9;
}

.window-name {
  font-weight: 700;
  color: var(--ink);
  font-size: 14px;
}

.window-time {
  color: var(--ink3);
  font-size: 12px;
  margin-top: 2px;
}

.window-left {
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
}

.window-option.disabled .window-left { color: var(--error); }

.day-message {
  font-size: 12px;
  margin-top: 10px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  line-height: 1.45;
}

.day-message.ok {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid #bbf7d0;
}

.day-message.warning {
  background: var(--warning-bg);
  color: var(--warning-text);
  border: 1px solid var(--warning-border);
}

.day-message.full {
  background: var(--error-bg);
  color: var(--error);
  border: 1px solid #f5c2c7;
}

.confirm-block {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin-bottom: 16px;
}

.confirm-block-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  margin-bottom: 12px;
}

.confirm-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 14px;
}

.confirm-item:last-child { margin-bottom: 0; }

.confirm-item .ci-label {
  color: var(--ink3);
  min-width: 116px;
  flex-shrink: 0;
}

.confirm-item .ci-value {
  font-weight: 500;
  color: var(--ink);
  line-height: 1.4;
}

.terms-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 20px;
  cursor: pointer;
}

.terms-check input[type=checkbox] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  accent-color: var(--accent);
  margin-top: 2px;
  cursor: pointer;
}

.terms-check span {
  font-size: 13px;
  color: var(--ink3);
  line-height: 1.5;
}

/* EPC Evidence Info Section */
.evidence-section {
  border: 1.5px solid var(--blue-border);
  border-radius: var(--radius);
  background: var(--blue-bg);
  margin-bottom: 20px;
  overflow: hidden;
}

.evidence-section-header {
  padding: 16px 20px;
}

.evidence-section-header h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  color: var(--blue-text);
  margin-bottom: 6px;
  line-height: 1.3;
}

.evidence-intro-text {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.6;
  margin-bottom: 12px;
}

.evidence-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1.5px solid var(--blue-border);
  border-radius: 6px;
  padding: 8px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--blue-text);
  cursor: pointer;
  transition: all 0.15s;
}

.evidence-toggle-btn:hover {
  background: white;
  border-color: var(--blue-text);
}

.evidence-toggle-icon {
  font-size: 11px;
  transition: transform 0.2s;
  display: inline-block;
}

.evidence-toggle-btn.open .evidence-toggle-icon {
  transform: rotate(180deg);
}

.evidence-guide {
  display: none;
  padding: 0 20px 20px;
}

.evidence-guide.open { display: block; }

.evidence-guide-intro {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.6;
  margin-bottom: 8px;
}

.evidence-guide-note {
  font-size: 13px;
  color: var(--ink3);
  line-height: 1.6;
  margin-bottom: 16px;
  font-style: italic;
}

.evidence-category {
  margin-bottom: 14px;
}

.evidence-category-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink2);
  margin-bottom: 6px;
}

.evidence-category ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.evidence-category ul li {
  font-size: 13px;
  color: var(--ink3);
  line-height: 1.5;
  padding: 3px 0 3px 16px;
  position: relative;
}

.evidence-category ul li::before {
  content: 'Â·';
  position: absolute;
  left: 4px;
  color: var(--blue-text);
  font-weight: 700;
}

.evidence-important-note {
  background: white;
  border: 1px solid var(--blue-border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.55;
  margin-top: 16px;
}

.evidence-important-note strong {
  color: var(--blue-text);
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.evidence-checkbox-wrap {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 20px 16px;
  border-top: 1px solid var(--blue-border);
  background: white;
  cursor: pointer;
}

.evidence-checkbox-wrap input[type=checkbox] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  accent-color: var(--blue-text);
  margin-top: 2px;
  cursor: pointer;
}

.evidence-checkbox-wrap span {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.5;
  font-weight: 500;
}

.evidence-warning {
  display: none;
  font-size: 12px;
  color: var(--error);
  padding: 8px 20px 12px;
  background: white;
  border-top: 1px solid #fde8e8;
}

.evidence-warning.show { display: block; }

.btn-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 20px 32px 28px;
  border-top: 1px solid var(--border);
}

.btn {
  padding: 14px 28px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: inline-flex;

function buildDateGrid() {
  const grid = document.getElementById('days-grid');
  grid.innerHTML = '';

  const allOptions = collectDateOptions();

  const availableOptions = allOptions
    .filter(day => day.dayAvailable)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .slice(0, 18);

  const fullSoon = allOptions
    .filter(day => !day.dayAvailable)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .slice(0, 4);

  if (availableOptions.length > 0) {
    const heading = document.createElement('div');
    heading.innerHTML = `
      <div class="calendar-heading">Available dates</div>
      <div class="calendar-subnote">The next available working days are shown in date order. Route information is shown inside each date.</div>
    `;
    grid.appendChild(heading);

    availableOptions.forEach(day => grid.appendChild(createDayCard(day)));
  } else {
    const msg = document.createElement('div');
    msg.className = 'no-dates-message';
    msg.innerHTML = 'No available dates were found in the next few weeks. Please contact EPC Pro for help arranging an appointment.';
    grid.appendChild(msg);
  }

  if (fullSoon.length > 0) {
    const heading = document.createElement('div');
    heading.innerHTML = `
      <div class="calendar-heading">Fully booked dates</div>
      <div class="calendar-subnote">These are shown for awareness only and cannot be selected.</div>
    `;
    grid.appendChild(heading);

    fullSoon.forEach(day => grid.appendChild(createDayCard(day)));
  }
}

function selectWindow(el, iso, str, windowName) {
  const availability = getAvailabilityForDate(iso);

  if (!isBookingWindowSelectable(availability, windowName)) {
    alert('Please choose an available AM window first. PM becomes available once AM is full for that date.');
    return;
  }

  document.querySelectorAll('.window-option').forEach(option => option.classList.remove('selected'));
  el.classList.add('selected');

  state.date = iso;
  state.dateStr = str;
  state.bookingWindow = windowName;
  state.selectedRouteFit = getRouteFitForDate(iso);

  const err = document.getElementById('err-date-window');
  if (err) err.classList.remove('show');
}

function toggleEvidenceGuide() {
  const guide = document.getElementById('evidence-guide');
  const btn = document.getElementById('evidence-toggle-btn');
  const isOpen = guide.classList.contains('open');
  if (isOpen) {
    guide.classList.remove('open');
    btn.classList.remove('open');
    btn.querySelector('span:first-child').textContent = 'View document guide';
  } else {
    guide.classList.add('open');
    btn.classList.add('open');
    btn.querySelector('span:first-child').textContent = 'Hide document guide';
  }
}

function goToStep(n) {
  const active = document.querySelector('.form-step.active');
  const cur = active && active.id === 'step-success' ? 6 : parseInt(active.id.replace('step-', ''), 10);

  if (n > cur) {
    if (cur === 1) {
      if (!state.type) {
        alert('Please select Domestic or Commercial.');
        return;
      }
    }

    if (cur === 2) {
      const addr = document.getElementById('address').value.trim();
      const pc = document.getElementById('postcode').value.trim().toUpperCase();
      const subtype = document.getElementById('prop-subtype').value;

      clearPricingErrors();

      if (!addr) {
        showErr('err-address', 'address');
        return;
      }

      if (!pc || !getZone(pc)) {
        showErr('err-postcode', 'postcode');
        return;
      }

      if (!subtype) {
        showErr('err-subtype', 'prop-subtype');
        return;
      }

      if (state.type === 'Domestic') {
        const domesticValue = document.getElementById('domestic-property-value').value;

        if (!domesticValue) {
          showErr('err-domestic-value', 'domestic-property-value');
          return;
        }

        if (domesticValue === '4000000') {
          const sqm = Number(document.getElementById('domestic-sqm').value || 0);
          if (!sqm || sqm <= 0) {
            showErr('err-domestic-sqm', 'domestic-sqm');
            return;
          }
        }

        if (!state.band || state.price === 0) {
          alert('Please complete the domestic pricing details.');
          return;
        }
      }

      if (state.type === 'Commercial') {
        if (!state.band) {
          const err = document.getElementById('err-band-commercial');
          if (err) err.classList.add('show');
          return;
        }
      }

      state.address = addr;
      state.postcode = pc;
      state.subtype = subtype;

      const zone = getZone(pc);
      state.zone = zone ? zone.code : '';
      state.zoneName = zone ? zone.name : '';

      loadLiveAvailability();
    }

    if (cur === 3) {
      if (!state.availabilityLoaded) {
        alert('Live availability has not loaded yet. Please wait a moment.');
        return;
      }

      if (!state.date || !state.bookingWindow) {
        const err = document.getElementById('err-date-window');
        if (err) err.classList.add('show');
        return;
      }

      const availability = getAvailabilityForDate(state.date);
      const stillAvailable = isBookingWindowSelectable(availability, state.bookingWindow);

      if (!stillAvailable) {
        alert('That window is no longer available. Please choose another available AM window, or PM if AM is full.');
        state.date = '';
        state.dateStr = '';
        state.bookingWindow = '';
        state.selectedRouteFit = null;
        buildDateGrid();
        return;
      }
    }

    if (cur === 4) {
      const fn = document.getElementById('fname').value.trim();
      const ln = document.getElementById('lname').value.trim();
      const em = document.getElementById('email').value.trim();
      const ph = document.getElementById('phone').value.trim();

      if (!fn) {
        showErr('err-fname', 'fname');
        return;
      }

      if (!ln) {
        showErr('err-lname', 'lname');
        return;
      }

      if (!em || !em.includes('@')) {
        showErr('err-email', 'email');
        return;
      }

      if (!ph) {
        showErr('err-phone', 'phone');
        return;
      }

      populateConfirm();
    }
  }

  document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
  document.getElementById('step-' + n).classList.add('active');

  document.querySelectorAll('.step-tab').forEach((tab, index) => {
    tab.classList.remove('active', 'done');
    if (index + 1 === n) tab.classList.add('active');
    if (index + 1 < n) tab.classList.add('done');
  });

  if (n === 2) {
    document.getElementById('domestic-pricing').style.display = state.type === 'Domestic' ? 'block' : 'none';
    document.getElementById('commercial-pricing').style.display = state.type === 'Commercial' ? 'block' : 'none';
    setSubtypeOptions(state.type);
  }

  if (n === 3) updatePriceSummary();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getEstimatedSquareMeterageFromBandName(band) {
  if (band.includes('0 to 100') || band.includes('100 mÂ²')) return 100;
  if (band.includes('101 to 200') || band.includes('151 to 300')) return 200;
  if (band.includes('201 to 300')) return 300;
  if (band.includes('301 to 400') || band.includes('301 to 500')) return 400;
  if (band.includes('401 to 500')) return 500;
  if (band.includes('501 to 600') || band.includes('501 to 10,000')) return 600;
  if (band.includes('601 to 700')) return 700;
  if (band.includes('701 to 800')) return 800;
  if (band.includes('801 to 900')) return 900;
  if (band.includes('901')) return 901;
  return null;
}

async function submitBooking() {
  if (!document.getElementById('terms').checked) {
    alert('Please confirm the booking terms before continuing.');
    return;
  }

  // For domestic bookings, require the evidence acknowledgement checkbox
  if (state.type === 'Domestic') {
    const ackBox = document.getElementById('evidence-ack');
    if (!ackBox || !ackBox.checked) {
      const warn = document.getElementById('evidence-warning');
      if (warn) warn.classList.add('show');
      document.getElementById('evidence-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }

  if (!supabaseClient) {
    alert('The booking system cannot connect to Supabase. Please call 07831 363 622 to book.');
    return;
  }

  const submitBtn = document.getElementById('submit-btn');
  const label = document.getElementById('submit-btn-label');

  submitBtn.disabled = true;
  label.textContent = 'Saving booking...';

  try {
    const latestAvailability = getAvailabilityForDate(state.date);
    const stillAvailable = isBookingWindowSelectable(latestAvailability, state.bookingWindow);

    if (!stillAvailable) {
      alert('That window is no longer available. Please choose another available AM window, or PM if AM is full.');
      submitBtn.disabled = false;
      label.textContent = 'Confirm booking request';
      goToStep(3);
      await loadLiveAvailability();
      return;
    }

    const reference = generateReference();
    const jobId = generateUUID();
    const routeFit = state.selectedRouteFit || getRouteFitForDate(state.date);

    state.reference = reference;

    const fname = document.getElementById('fname').value.trim();
    const lname = document.getElementById('lname').value.trim();
    const fullName = `${fname} ${lname}`.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const access = document.getElementById('access').value.trim();
    const referral = document.getElementById('referral').value || 'Website';

    const documents = {
      public_reference: reference,
      job_id: jobId,
      customer_name: fullName,
      customer_email: email,
      customer_phone: phone,
      property_address: state.address,
      postcode: state.postcode,
      zone_code: state.zone,
      zone_name: state.zoneName,
      service_type: state.type,
      epc_type: state.type,
      property_subtype: state.subtype,
      pricing_band: state.band,
      pricing_basis: state.pricingBasis,
      property_value: state.propertyValue,
      square_meterage: state.squareMeterage,
      quote_amount: state.price,
      deposit_amount: state.deposit,
      balance_due: state.balance,
      duration_minutes: state.duration,
      booking_date: state.date,
      booking_window: state.bookingWindow,
      booking_window_label: state.bookingWindow === 'AM' ? '08:00 - 13:00' : '13:00 - 17:00',
      route_fit: routeFit.code,
      route_fit_label: routeFit.label,
      route_message: routeFit.message,
      route_review_required: routeFit.reviewRequired,
      existing_route_areas: routeFit.existingAreas || [],
      route_display_priority: isRecommendedRouteFit(routeFit) ? 'recommended' : 'less_suitable',
      access_instructions: access,
      source: referral,
      evidence_info_acknowledged: state.type === 'Domestic' ? true : null,
      created_from: 'booking_app',
      capacity_rule: {
        am_capacity: AM_CAPACITY,
        pm_capacity: PM_CAPACITY,
        day_capacity: DAY_CAPACITY
      },
      created_at: new Date().toISOString()
    };

    const contact = await insertContact({
      name: fullName,
      email: email,
      phone: phone,
      type: 'Client',
      client_reference: reference
    });

    const property = await insertProperty({
      contact_id: contact ? contact.id : null,
      address: state.address,
      postcode: state.postcode,
      city: 'London',
      property_value: state.propertyValue,
      square_meterage: state.squareMeterage
    });

    const leadStatus = state.type === 'Commercial' || state.price === 0 ? 'Review required' : 'Awaiting booking';

    const lead = await insertLead({
      contact_id: contact ? contact.id : null,
      property_id: property ? property.id : null,
      property_address: state.address,
      postcode: state.postcode,
      source: referral,
      status: leadStatus,
      epc_type: state.type,
      property_value: state.propertyValue,
      square_meterage: state.squareMeterage,
      estimated_value: state.price,
      documents: documents
    });

    const jobPayload = {
      id: jobId,
      contact_id: contact ? contact.id : null,
      property_id: property ? property.id : null,
      lead_id: lead ? lead.id : null,
      reference: reference,
      booking_date: state.date,
      booking_window: state.bookingWindow,
      provisional_eta: 'TBC',
      deposit_amount: state.deposit,
      deposit_paid: false,
      invoice_issued: false,
      invoice_amount: state.price,
      balance_due: state.type === 'Commercial' ? state.price : state.balance,
      epc_type: state.type,
      status: leadStatus,
      source: referral,
      documents: documents,
      field_status: null
    };

    try {
      await insertJob(jobPayload);
    } catch (jobErr) {
      console.warn('Full job insert failed. Retrying minimal job payload:', jobErr.message);

      const minimalJobPayload = {
        id: jobId,
        reference: reference,
        booking_date: state.date,
        booking_window: state.bookingWindow,
        provisional_eta: 'TBC',
        deposit_amount: state.deposit,
        deposit_paid: false,
        invoice_issued: false,
        invoice_amount: state.price,
        balance_due: state.type === 'Commercial' ? state.price : state.balance,
        epc_type: state.type,
        status: leadStatus,
        source: referral,
        documents: documents,
        field_status: null
      };

      await insertJob(minimalJobPayload);
    }

    document.getElementById('booking-ref-num').textContent = reference;

    document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
    document.getElementById('step-success').classList.add('active');
    document.querySelector('.progress-wrap').style.display = 'none';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    console.error('Booking submission error:', err);
    alert('There was a problem saving the booking request: ' + (err.message || err));
    submitBtn.disabled = false;
    label.textContent = 'Confirm booking request';
  }
}
